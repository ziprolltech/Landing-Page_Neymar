<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=3840, height=2160">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 3840px; height: 2160px; overflow: hidden; background: #06070a; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #06070a; }
      #sala { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      /* vinheta leve de lente */
      #vinheta {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse 75% 70% at 50% 50%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.22) 100%);
      }
      /* escuro de abertura (continuidade com as portas da home) e branco final */
      #escuro { position: absolute; inset: 0; background: #06070a; pointer-events: none; }
      #branco { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.4" data-width="3840" data-height="2160">
      <video id="sala" class="clip" src="assets/sala.mp4" muted playsinline data-start="0" data-duration="5.4" data-track-index="0"></video>
      <div id="vinheta"></div>
      <div id="escuro"></div>
      <div id="branco"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* 0–0.9s: as luzes acendem, com a piscada típica de lâmpada */
      tl.set("#escuro", { opacity: 1 }, 0);
      tl.to("#escuro", { opacity: 0.55, duration: 0.06, ease: "none" }, 0.18);
      tl.to("#escuro", { opacity: 0.92, duration: 0.05, ease: "none" }, 0.26);
      tl.to("#escuro", { opacity: 0.3, duration: 0.06, ease: "none" }, 0.36);
      tl.to("#escuro", { opacity: 0.6, duration: 0.05, ease: "none" }, 0.44);
      tl.to("#escuro", { opacity: 0, duration: 0.45, ease: "power2.out" }, 0.5);

      /* 4.5–5.4s: a luz estoura e tudo vira branco (o palco do site aparece por trás) */
      tl.fromTo("#sala", { filter: "brightness(1)" }, { filter: "brightness(1.6)", duration: 0.5, ease: "power1.in" }, 4.5);
      tl.to("#sala", { filter: "brightness(3.2)", duration: 0.4, ease: "power2.in" }, 5.0);
      tl.to("#branco", { opacity: 0.55, duration: 0.45, ease: "power1.in" }, 4.75);
      tl.to("#branco", { opacity: 1, duration: 0.2, ease: "power2.in" }, 5.2);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
